<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="signup-card">

        <!-- LEFT PANEL -->
        <div class="left-panel">
            <h1>Welcome 👋</h1>
            <p>
                You have successfully logged in.
                This dashboard follows the same
                theme as the authentication system.
            </p>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel login-panel">
            <div class="login-box">

                <h2>Dashboard</h2>
                <p class="login-subtitle">
                    Manage your profile and account actions
                </p>

                <!-- PROFILE CARD -->
                <div class="profile-card">
                    <div class="avatar">C</div>
                    <h3>Chetan</h3>
                    <p>Java Full Stack Developer</p>
                </div>

                <!-- ACTION LINKS -->
                <div class="switch">
                    <a href="#">Update Profile</a> |
                    <a href="#">Logout</a> |
                    <a href="#">Delete Account</a>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
